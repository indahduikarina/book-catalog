<nav class="navbar">

  <div class="navbar-container">

    <!-- BRAND -->

    <a
      routerLink="/"
      class="brand"
    >
      ProductCatalog
    </a>


    <!-- NAVIGATION -->

    <div class="nav-links">

      <!-- HOME -->

      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Home
      </a>


      <!-- PRODUCTS -->

      <a
        routerLink="/books"
        routerLinkActive="active"
      >
        Products
      </a>


      <!-- CART -->

      <a
        routerLink="/cart"
        routerLinkActive="active"
        class="cart-link"
      >

        <span class="cart-icon">
          🛒
        </span>

        <span>
          Cart
        </span>

        @if (cartCount > 0) {

          <span class="cart-badge">
            {{ cartCount }}
          </span>

        }

      </a>

    </div>

  </div>

</nav>
